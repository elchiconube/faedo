name = "faedo-instagram-poster"
main = "src/index.ts"
compatibility_date = "2026-08-27"

# Lunes, miércoles y viernes a las 9:00 UTC
[triggers]
crons = ["0 9 * * 1,3,5"]

[[kv_namespaces]]
binding = "CONTENT_KV"
id = "97818fc7fda242aa913db299d701d82b"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "faedo-instagram"

[vars]
MEDIA_BASE_URL = "https://media.faedo.es"
INSTAGRAM_API_VERSION = "v25.0"

# Secretos (no van aquí, se configuran con `wrangler secret put`):
#   INSTAGRAM_ACCESS_TOKEN
#   INSTAGRAM_USER_ID
#   ADMIN_USERNAME
#   ADMIN_PASSWORD
